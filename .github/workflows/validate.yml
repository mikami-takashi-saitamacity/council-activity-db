# データを push するたびに、スキーマ違反と明らかな型崩れを自動で止める。
name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - run: python .github/validate.py
      - run: python .github/validate.py --require-budget-v12-fields
      - run: python scripts/build_stats.py --check
      - run: python scripts/finalize_budget_source_urls.py --check
      - run: python scripts/check_provisional_age.py
      - run: python -m unittest discover -s tests -v
